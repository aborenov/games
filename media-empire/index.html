  'use strict';
  const root=document.getElementById('game');
  const modalRoot=document.getElementById('modal-root');
  const toastEl=document.getElementById('toast');
  const SAVE_KEY='media-empire-studio-newspaper-0.1';
  const chapterLength=12;
  const CITY_HOUSEHOLDS=30000;
  const AD_BUDGET=2800;
  const currency=new Intl.NumberFormat('ru-RU',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
  const num=new Intl.NumberFormat('ru-RU');
  const money=n=>currency.format(Number(n)||0).replace('US$','$');
  const nfmt=n=>num.format(Math.round(n||0));
  const sign=n=>(n>=0?'+':'')+money(n);
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
  const rand=(week,k=1)=>{let x=Math.sin(week*127.1+k*311.7+1900)*43758.5453;return x-Math.floor(x)};
  const STORIES = [
    ['Город открывает новый век','Фабричные трубы меняют горизонт','Что ждёт железную дорогу','Кому достанутся новые квартиры','Магазины: цены в январе','Театральный сезон в Белфорде','Садовники готовят парк к весне','Рабочие кварталы просят освещение'],
    ['Город после первого снегопада','Новая линия конки: кто заплатит','Банки и ремесленники спорят','Зимний рынок: что подорожало','Школьные классы переполнены','Вечерние концерты собирают публику','Секреты старого водопровода','Почта выходит на новый маршрут'],
    ['Белфорд растёт к северу','Крупные фабрики набирают рабочих','Проверяем цену городской земли','Владельцы лавок создают союз','Где горожане покупают хлеб','Новый спектакль в ратуше','Город спорит о мосте через реку','Телеграф принёс новости столицы'],

    ['Время больших городских сделок','Фабриканты требуют налоговых льгот','Порт принимает новые грузы','Городской бюджет под проверкой','Как сэкономить на отоплении','Выставка механических чудес','Детская библиотека открыла двери','Наш читатель нашёл забытый архив'],
    ['Газеты спорят за каждого читателя','Независимые лавки против монополии','Городской банк меняет проценты','Карта новых трамвайных маршрутов','Что изменилось в цене молока','Большой театральный праздник','Сельский рынок вышел к вокзалу','Депутаты спорят о водоснабжении'],
    ['Мост объединит два берега?','Электростанция снова в центре спора','Куда уходят налоги граждан','Малые предприятия нанимают людей','Покупки недели: обзор рынка','Велосипеды покоряют Белфорд','Юные инженеры изобрели прибор','Городской совет выступил с отчётом'],
    ['Спор за землю у станции','Почему растут дорожные сборы','Новый склад на речной пристани','Рабочие требуют повышения платы','Семь важных цен недели','Любительский театр собирает зал','Письма о новых пригородах','Горожане выбирают городской парк'],
    ['Печать меняет саму журналистику','Промышленники спорят о тарифах','Новый рынок для сельских товаров','Семья и расходы: цифры месяца','Сколько платят молодым врачам','Фестивальная афиша Белфорда','Кто отвечает за городские трубы','Читатели требуют честного ответа'],
    ['Вторая большая издательская война','Новый хозяин старой типографии','Деньги города: открытый баланс','Почему конка опаздывает утром','Магазины открывают новые отделы','Актёр возвращается из столицы','Документы по городским ссудам','Зимний маршрут до фабрики'],
    ['Независимый издатель идёт на рынок','Соперники снижают цены','Тайные сделки крупного бизнеса','Рабочие объединяют кооперативы','Новые торговые правила недели','Лекции в городской библиотеке','Северная газета: первое заявление','Спор из-за строительства школы'],
    ['Три месяца, изменившие Белфорд','Что стало с новой электростанцией','Как поделили газетный рынок','Цена городской недвижимости','Домашний бюджет: итоги сезона','Лучшие спектакли первого квартала','Горожане оценивают наш проект','Куда дальше пойдёт Белфорд']
  ];
  const TOPICS=['Город','Промышленность','Расследование','Деньги','Потребитель','Культура','Общество','Телеграф'];
  const BASE_COST=[21,29,41,18,13,16,25,17];
  const EFFECT=[1,1,2,0,0,1,2,0];
  const CAPTIONS=['Набросок улицы Белфорда. Архив редакции.','Зарисовка городского корреспондента.','Иллюстрация к главному материалу.','Деловой квартал Белфорда, 1900 год.'];
  let active='editor',loc='newsroom',modal=null;
  let state=readSave();
  function starter(){return {
    version:1,week:1,cash:4000,loan:2000,trust:60,price:0.08,printed:9000,
    selected:[0,1,2,3,4,5],lead:0,readers:0,history:[],policy:'Газета для каждого',
    investigation:null,headlineEdit:null,
    rivals:[
      {id:'chrono',name:'Городская хроника',price:0.12,printed:9400,lastSales:7100,trust:73,cash:6000,active:true,action:'Ставка на городские расследования и дорогой выпуск'},
      {id:'listok',name:'Народный листок',price:0.07,printed:11000,lastSales:8300,trust:51,cash:4100,active:true,action:'Демпинг на массовом рынке'},
      {id:'courier',name:'Деловой курьер',price:0.15,printed:4600,lastSales:3100,trust:78,cash:7200,active:true,action:'Профессиональная аудитория и дорогая реклама'}
    ],events:[{week:1,text:'Редакция открыта. Начальная стратегия — «Газета для каждого»: цена 0,08, тираж 9 000.'}]
  }}
  function readSave(){
    try{const x=JSON.parse(localStorage.getItem(SAVE_KEY));if(validSave(x))return x;}catch{}
    return starter();
  }
  function validSave(x){return Boolean(x&&x.version===1&&Number.isInteger(x.week)&&x.week>=1&&x.week<=13&&Array.isArray(x.selected)&&Array.isArray(x.rivals)&&Array.isArray(x.history)&&Array.isArray(x.events)&&Number.isFinite(x.cash)&&Number.isFinite(x.loan)&&Number.isFinite(x.trust)&&Number.isFinite(x.price)&&Number.isFinite(x.printed)&&x.history.length<=12)}
  function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch{}}
  const weekDate=week=>new Date(Date.UTC(1900,0,6+(week-1)*7)).toLocaleDateString('ru-RU',{day:'numeric',month:'long',timeZone:'UTC'});
  function storiesFor(week=state.week){return STORIES[Math.min(11,Math.max(0,week-1))].map((title,i)=>({id:i,title,tag:TOPICS[i],cost:BASE_COST[i]+(i*week)%9,trust:EFFECT[i]}))}
  function leadStory(){return storiesFor()[state.lead]||storiesFor()[0]}
  function appeal(trust,price,type=0){return Math.max(15,(trust+43)*(0.095/price)**1.12)*(1+type)}
  function getForecast(s=state){
    const selected=s.selected.length? s.selected : [0];
    const quality=selected.reduce((t,i)=>t+EFFECT[i],0);
    const mix=new Set(selected.map(i=>TOPICS[i])).size;
    const playerScore=appeal(s.trust,s.price,((quality/12)+(mix-6)*.018-0.35)) * (s.investigation==='publish'&&s.week===4?1.15:1);
    const rScores=s.rivals.map((r,i)=>r.active?appeal(r.trust,r.price,[.02,.10,-.2,.03][i]||0):0);
    const outside=52;
    const total=playerScore+rScores.reduce((a,b)=>a+b,0)+outside;
    const pool=28000;
    const demand=Math.max(0,Math.round(pool*playerScore/total));
    const sold=Math.min(s.printed,demand);
    const rivalSales=s.rivals.map((r,i)=>Math.min(r.printed,Math.round(pool*rScores[i]/total)));
    const allSales=sold+rivalSales.reduce((a,b)=>a+b,0);
    const adRevenue=Math.round(AD_BUDGET*(sold/Math.max(1,allSales))*(.83+s.trust/400));
    const ticket=Math.round(sold*s.price);
    const editorCost=selected.reduce((t,i)=>t+BASE_COST[i]+(i*s.week)%9,0);
    const printCost=Math.round(s.printed*.036);
    const overhead=465;
    const interest=Math.round(s.loan*.009);
    const fixed=overhead+editorCost+interest;
    const expenses=printCost+fixed;
    const estimated=ticket+adRevenue-expenses;
    return {sold,demand,rivalSales,adRevenue,ticket,editorCost,printCost,overhead,interest,expenses,estimated,allSales,share:sold/CITY_HOUSEHOLDS,quality,score:playerScore};
  }
  function art(topic=0){
    const sky=`<defs><linearGradient id="fadesky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4cab4"/><stop offset="1" stop-color="#897d68"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#746c59" stroke-width=".65" opacity=".35"/></pattern></defs>`;
    const landscape=`<rect width="900" height="270" fill="url(#fadesky)"/><g stroke="#423f35" stroke-width="2" fill="#766e5d"><path d="M0 245V123l83-18v140M63 235V88l60-10v167M106 245V147l87-27v125M178 235V91l60 7v137M239 245V126l91-24v143M318 245V77h62v168M380 245V140l74-12v117M447 245V107l85 13v125M532 245V154l59-11v102M604 245V107l64-14v152M676 245V145l80-17v117M763 245V95l63-8v158M830 245V128l70 16v101"/><path d="M334 78V17m350 80V35" stroke="#59584c" stroke-width="6"/><path d="M320 30h27M675 38h26" stroke="#59584c" stroke-width="3"/></g><g stroke="#e7d9bd" opacity=".55" stroke-width="3">${Array.from({length:32},(_,i)=>`<path d="M${i*28+7} ${150-(i%4)*9}v8"/>`).join('')}</g><path d="M0 236h900v35H0z" fill="#3d4038"/><path d="M0 236l900-15" stroke="#cdc3a7" stroke-width="3"/>`;
    const factory=`<path d="M0 226l82-68 45 20 75-63 96 32 67-94 82 62 86-34 95 79 77-31 90 58 105-48v132H0" fill="#716858" stroke="#504c42" stroke-width="3"/><g fill="#5f5d50" stroke="#3f4037" stroke-width="4"><rect x="70" y="80" width="42" height="150"/><rect x="211" y="33" width="36" height="188"/><rect x="534" y="65" width="38" height="171"/><rect x="780" y="19" width="35" height="218"/></g><g opacity=".35" fill="none" stroke="#e2daca" stroke-width="19"><path d="M88 70Q145 25 126 -20M225 18Q290 -35 260 -45M795 13Q830 -21 825 -55"/></g><path d="M0 245H900" stroke="#393e35" stroke-width="48"/>`;
    const river=`<rect width="900" height="275" fill="#b9b19e"/><path d="M0 195Q250 144 450 196T900 183v100H0" fill="#736f63"/><g fill="#625f51" stroke="#4c4a40" stroke-width="3"><path d="M45 182v-91l85-27v119M154 169V87l65 8v70M270 164V48l73 17v100M346 180v-88l66 10v79M535 156V72l70-14v107M610 166v-91l75 21v78M747 157V46l78 27v98"/></g><path d="M0 151H900M0 168H900" stroke="#363e37" stroke-width="13"/><path d="M110 155V212M345 155v36M590 155v50M808 155v38" stroke="#363e37" stroke-width="15"/>`;
    const market=`<rect width="900" height="270" fill="#c8bfa7"/><path d="M0 180h900v90H0" fill="#78735e"/><g stroke="#565349" stroke-width="3" fill="#a69a81">${Array.from({length:8},(_,i)=>`<path d="M${i*115} 177V90h95v87z"/><path d="M${i*115-8} 96l56-48 56 48z" fill="#625e51"/><path d="M${i*115+18} 129h20v49h-20zM${i*115+56} 129h24v26h-24z" fill="#666358"/>`).join('')}</g><path d="M100 214Q450 180 810 221" fill="none" stroke="#4f5148" stroke-width="15"/>`;
    const scene=topic%4===1?factory:topic%4===2?river:topic%4===3?market:landscape;
    return `<svg viewBox="0 0 900 270" role="img" aria-label="Гравюра из газеты Белфорда, 1900 год" preserveAspectRatio="xMidYMid slice">${sky}${scene}<rect width="900" height="270" fill="url(#hatch)" opacity=".5"/><rect x="7" y="7" width="886" height="256" fill="none" stroke="#eee2c7" stroke-width="3" opacity=".5"/></svg>`;
  }
  function statStrip(){const f=getForecast();return `<div class="statstrip"><div><small>Касса издательства</small><strong class="${state.cash<900?'loss':''}">${money(state.cash)}</strong></div><div><small>Читатели прошлого номера</small><strong>${nfmt(state.readers)}</strong></div><div><small>Доверие аудитории</small><strong>${state.trust}<span style="font-size:15px;color:#b4b6a5">/100</span></strong></div><div><small>Доля рынка · прогноз</small><strong>${(100*f.share).toFixed(1)}%</strong></div></div>`}
  function paper(h=null){
    const isHistory=Boolean(h);
    const selected=isHistory?h.selected:state.selected;
    const titles=isHistory?h.stories:storiesFor().map(x=>x.title);
    const main=isHistory?h.lead:state.lead;
    const title=titles[main]||'Город открывает новый век';
    const issue=isHistory?h.week:state.week;
    const colTitles=selected.filter(x=>x!==main).slice(0,3).map(i=>titles[i]);
    while(colTitles.length<3)colTitles.push(['Факты недели','Голоса читателей','Короткая хроника'][colTitles.length]);
    return `<div class="paper-sheet"><div class="paper-topline"><span>НЕЗАВИСИМАЯ ГОРОДСКАЯ ПРЕССА</span><span>БЕЛФОРД · 1900</span></div><div class="paper-mast"><b>Городской вестник</b></div><div class="paper-ribbon"><span>Суббота, ${esc(weekDate(issue))}</span><span>ВЫПУСК №${String(issue).padStart(3,'0')}</span><span>ЦЕНА ${money(isHistory?h.price:state.price)}</span></div><div class="paper-heading">${esc(title)}</div><div class="paper-strap">Репортажи, документы и мнения — всё важное для горожан в одном издании.</div><div class="hero-frame">${art(main)}<span class="stamp">1900</span></div><div class="paper-caption">${CAPTIONS[main%4]}</div><div class="paper-columns">${colTitles.map((t,i)=>`<div class="paper-column"><b>${esc(t)}</b><p>${['Наш корреспондент собрал факты и голоса очевидцев. Редакция следит за последствиями для всех жителей города.','Сложные решения городского совета меняют повседневную жизнь. В нашем материале — подробности, которые нельзя пропустить.','Отдельное расследование, полезные цифры и взгляд в будущее. Читайте полный репортаж на внутренних полосах.'][i]}</p></div>`).join('')}</div><div class="paper-end">ГОРОДСКОЙ ВЕСТНИК · ЧИТАЙТЕ НАС КАЖДУЮ СУББОТУ · БЕЛФОРД</div></div>`;
  }
  function editor(){const f=getForecast();const stories=storiesFor();return `<div class="screen-inner"><div class="intro"><div><div class="eyebrow">АКТ I / ВЕК ГАЗЕТ · НАСТОЯЩАЯ ИГРОВАЯ ПАРТИЯ</div><h1 class="section-title">Первая полоса</h1><p class="section-sub">Вы создаёте городской еженедельник. Каждое решение меняет спрос, деньги, репутацию и стратегию конкурентов.</p></div><div class="intro-aside">Номер ${String(state.week).padStart(2,'0')} из 12<br><b>Курс: «${esc(state.policy)}»</b></div></div>${state.week===4&&state.investigation===null?`<div class="event-banner"><div><h3>Документы об электростанции</h3><p>Источник предлагает доказательства нарушений. Расследование может изменить доверие и отношения с рекламодателями.</p></div><button data-action="investigate">Решить</button></div>`:''}<div class="editor-layout"><div class="paper-canvas">${paper()}<div class="bottom-note"><span>ПРЕДПРОСМОТР БУДУЩЕГО НОМЕРА</span><span>6 редакционных + 2 рекламные полосы</span></div></div><aside class="ledger"><div class="plate"><div class="plate-title"><div><div class="eyebrow">ТИПОГРАФИЯ</div><h3>Печать номера</h3></div><span class="num">01 / 02</span></div><div class="slider-title"><span>Цена экземпляра</span><output id="price-output">${money(state.price)}</output></div><input id="price-slider" type="range" min="0.06" max="0.20" step="0.01" value="${state.price}" data-change="price" aria-label="Цена экземпляра"><div class="slider-extremes"><span>$0.06</span><span>$0.20</span></div><div class="slider-title"><span>Тираж</span><output id="print-output">${nfmt(state.printed)}</output></div><input id="print-slider" type="range" min="2000" max="14000" step="500" value="${state.printed}" data-change="printed" aria-label="Тираж"><div class="slider-extremes"><span>2 000</span><span>14 000</span></div><hr class="ledger-separator"><div class="tiny">По последней оценке аудитории, спрос составляет примерно <b style="color:#e9d5b7" id="demand-val">${nfmt(f.demand)}</b> экземпляров.</div><div class="strategy-note" style="margin-top:14px">«Газета для каждого» — доступная цена и массовая аудитория. Можно изменить цену и тираж прямо сейчас.</div></div><div class="plate"><div class="plate-title"><div><div class="eyebrow">ФИНАНСОВЫЙ ОТДЕЛ</div><h3>Прогноз выпуска</h3></div><span class="num">02 / 02</span></div><div id="forecast"><div class="lineitem"><span>Продажи</span><strong>${money(f.ticket)}</strong></div><div class="lineitem"><span>Рекламная выручка</span><strong>${money(f.adRevenue)}</strong></div><div class="lineitem"><span>Бумага и печать</span><strong>−${money(f.printCost)}</strong></div><div class="lineitem"><span>Редакция, аренда, проценты</span><strong>−${money(f.expenses-f.printCost)}</strong></div><div class="lineitem total"><span>Ожидаемый результат</span><strong class="${f.estimated>=0?'gain':'loss'}">${sign(f.estimated)}</strong></div></div><p class="tiny" style="margin-top:14px">Прогноз не гарантирует результат: соперники могут менять цену и редакционную политику.</p></div></aside></div><section class="story-section"><div class="story-section-head"><div><div class="eyebrow">РЕДАКЦИОННЫЙ СОВЕТ</div><h2>Материалы номера</h2></div><div class="story-progress">Выбрано <b id="selected-count">${state.selected.length}</b> / 6</div></div><div class="story-grid">${stories.map(s=>`<div class="story-card ${state.selected.includes(s.id)?'chosen':''}" data-action="story" data-id="${s.id}" role="button" tabindex="0" aria-pressed="${state.selected.includes(s.id)}"><div class="tag"><span>${esc(s.tag)}</span><b>${state.selected.includes(s.id)?'✓ В НОМЕРЕ':'+ ДОБАВИТЬ'}</b></div><h3>${esc(s.title)}</h3><p>Редакция: ${money(s.cost)} · доверие ${s.trust>0?'+':''}${s.trust} <span style="float:right;color:#e6c391" data-action="lead" data-id="${s.id}">${state.lead===s.id?'★ На первой':'☆ На первую'}</span></p></div>`).join('')}</div></section></div>`}
  function market(){const f=getForecast();const players=[{name:'Городской вестник',trust:state.trust,price:state.price,printed:state.printed,lastSales:state.readers||f.sold,cash:state.cash,action:'Ваш курс: '+state.policy,active:true},...state.rivals];return `<div class="screen-inner"><div class="intro"><div><div class="eyebrow">РЫНОК НЕ ЖДЁТ ВАШИХ РЕШЕНИЙ</div><h1 class="section-title">Газетные войны</h1><p class="section-sub">Каждое издательство имеет собственные деньги, цену, объём печати и стратегию. Конкуренты реагируют на ваши выпуски и могут разориться.</p></div><div class="intro-aside"><b>30 000</b> домохозяйств<br>Рекламный рынок <b>${money(AD_BUDGET)}/нед.</b></div></div>${statStrip()}<div class="market-grid">${players.map((p,i)=>{const sold=i===0?f.sold:p.lastSales;const share=100*sold/CITY_HOUSEHOLDS;return `<div class="rival ${i===0?'you':''}"><div class="rival-head"><div><div class="eyebrow">${i===0?'ВАША КОМПАНИЯ':'КОНКУРЕНТ / '+String(i).padStart(2,'0')}</div><h3>${esc(p.name)}</h3><div class="tiny">${p.active?'Издание действует':'Выпуск остановлен'}</div></div><div class="monogram">${esc(p.name[0])}</div></div><div class="rival-metrics"><div><strong>${money(p.price)}</strong><span>Цена номера</span></div><div><strong>${nfmt(sold)}</strong><span>Читателей</span></div><div><strong>${money(p.cash)}</strong><span>В кассе</span></div></div><div class="tiny">Доля городского рынка: ${share.toFixed(1)}%</div><div class="share-rail"><i style="width:${clamp(share,0,100)}%"></i></div><div class="rival-action">${esc(p.action)}</div></div>`}).join('')}</div><div class="notice">Модель рынка тестовая: конкуренты совершают самостоятельные ходы каждую неделю, их продажи и деньги пересчитываются, а не появляются по сценарию. На 11-й неделе возможно возникновение новой независимой газеты.</div></div>`}
  function citySvg(){return `<svg viewBox="0 0 980 550" role="img" aria-label="Карта Белфорда с редакцией, типографией, банком и рынком"><defs><linearGradient id="cityground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#526458"/><stop offset="1" stop-color="#283c39"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8ca99b"/><stop offset="1" stop-color="#4b7371"/></linearGradient></defs><rect width="980" height="550" fill="url(#cityground)"/><path d="M-40 390Q260 310 390 390T990 300V550H-40" fill="url(#water)"/><g opacity=".5" fill="none" stroke="#a7a796" stroke-width="33"><path d="M0 80L980 490M0 180L980 20M300 0L160 530M810 0L580 550"/></g><g opacity=".7" stroke="#3b4c44" stroke-width="2" fill="#778573">${Array.from({length:24},(_,i)=>{const x=24+(i%8)*118,y=26+Math.floor(i/8)*120+(i%3)*17;return `<path d="M${x} ${y+35}l38-19 44 18-40 18z"/><path d="M${x} ${y+35}l42 17v31l-42-18z" fill="#546558"/><path d="M${x+42} ${y+52}l40-18v30l-40 19z" fill="#445951"/>`}).join('')}</g><g class="world-obj" data-action="loc" data-id="newsroom"><path d="M295 215l101-54 112 53-104 55z" fill="#d5aa75" stroke="#182723" stroke-width="3"/><path d="M295 215l109 54v105l-109-51z" fill="#7f6e59" stroke="#1a302a" stroke-width="3"/><path d="M404 269l104-55v108l-104 52z" fill="#68594b" stroke="#1a302a" stroke-width="3"/><path d="M346 290l29 14v62l-29-14z" fill="#343e3b"/><path d="M427 287l34-18v42l-34 17z" fill="#b7c7ac"/><text x="395" y="144" text-anchor="middle" class="isometric-label">РЕДАКЦИЯ</text><rect x="295" y="142" width="214" height="233" fill="transparent" style="pointer-events:all"/></g><g class="world-obj" data-action="loc" data-id="press"><path d="M610 190l96-45 124 52-105 56z" fill="#cba977" stroke="#182723" stroke-width="3"/><path d="M610 190l115 63v96l-115-56z" fill="#7b7265" stroke="#1a302a" stroke-width="3"/><path d="M725 253l105-56v95l-105 57z" fill="#655d50" stroke="#1a302a" stroke-width="3"/><path d="M650 165V81h29v99M762 160V60h26v121" stroke="#6b685c" stroke-width="6" fill="#aaa291"/><text x="723" y="130" text-anchor="middle" class="isometric-label">ТИПОГРАФИЯ</text><rect x="610" y="60" width="220" height="290" fill="transparent" style="pointer-events:all"/></g><g class="world-obj" data-action="loc" data-id="bank"><path d="M135 103l79-32 79 32-79 38z" fill="#ded1aa"/><path d="M134 113l80 35v101l-80-31z" fill="#a9a081"/><path d="M214 148l80-38v105l-80 34z" fill="#857e68"/><path d="M149 158l22 7v51l-22-7zM180 171l21 9v47l-21-9z" fill="#504f47"/><text x="215" y="55" text-anchor="middle" class="isometric-label">БАНК</text><rect x="135" y="54" width="160" height="196" fill="transparent" style="pointer-events:all"/></g><g class="world-obj" data-action="loc" data-id="market"><path d="M55 315l110-58 104 50-106 56z" fill="#dfaa7b"/><path d="M55 315l108 48v76L55 388z" fill="#70644d"/><path d="M163 363l106-56v77l-106 55z" fill="#5b5f4c"/><path d="M65 310l25-25 23 39zM115 293l26-23 21 43zM170 290l28-18 21 33z" fill="#ddc18d"/><text x="167" y="244" text-anchor="middle" class="isometric-label">РЫНОК</text><rect x="53" y="239" width="216" height="200" fill="transparent" style="pointer-events:all"/></g><path d="M340 468l440-106" stroke="#c7d0b7" stroke-width="4" stroke-dasharray="18 13" opacity=".65"/><text x="782" y="498" text-anchor="end" fill="#d7d7b6" font="italic 19px Georgia">БЕЛФОРД · 1900</text></svg>`}
  const places={newsroom:{title:'Редакция «Городского вестника»',eyebrow:'ШТАБ ИЗДАТЕЛЬСТВА',text:'Здесь верстают номер, назначают темы и выбирают главный материал. Часы журналистов и доверие читателей влияют на будущее компании.',fact:'Штат: 6 сотрудников · 6 редакционных полос'},press:{title:'Городская типография',eyebrow:'ПРОИЗВОДСТВО',text:'Каждый отпечатанный экземпляр стоит денег, независимо от того, купят его или нет. Тираж управляется во вкладке «Редакция».',fact:'Лимит печати: 14 000 экз. в неделю'},bank:{title:'Коммерческий банк Белфорда',eyebrow:'ФИНАНСИРОВАНИЕ',text:'Газета начинала с кредита 2 000. На незакрытый остаток еженедельно начисляются проценты. Банк оценивает платёжеспособность.',fact:'Остаток долга: '+money(state.loan)},market:{title:'Городской рынок',eyebrow:'ПОКУПАТЕЛИ И РЕКЛАМА',text:'Город насчитывает 30 000 домохозяйств. За них борются четыре газеты, а общий рекламный бюджет ограничен.',fact:'Рекламный рынок: '+money(AD_BUDGET)+' в неделю'}};
  function world(){const p=places[loc]||places.newsroom;return `<div class="screen-inner"><div class="intro"><div><div class="eyebrow">ЖИВОЙ ГОРОД / КАРТА КАМПАНИИ</div><h1 class="section-title">Белфорд, 1900</h1><p class="section-sub">Город — не фон. Здесь находятся наши активы, рекламодатели, покупатели, типография и конкуренты. Выберите объект на карте.</p></div></div>${statStrip()}<div class="world-stage"><div class="world-frame">${citySvg()}</div><div class="world-info"><div class="eyebrow">${p.eyebrow}</div><h3>${p.title}</h3><p>${p.text}</p><div class="fact">${p.fact}</div><div class="saves-group"><button class="btn" data-action="tab" data-tab="${loc==='press'||loc==='newsroom'?'editor':loc==='market'?'market':'finance'}">Перейти к управлению</button></div></div></div></div>`}
  function archive(){return `<div class="screen-inner"><div class="intro"><div><div class="eyebrow">ИСТОРИЯ ИЗДАТЕЛЬСТВА</div><h1 class="section-title">Каждый номер остаётся</h1><p class="section-sub">Здесь сохраняются первые полосы, результаты печати и последующие изменения аудитории. Откройте выпуск и сравните результаты решений.</p></div><div class="intro-aside"><b>${state.history.length}</b> номеров в архиве</div></div>${state.history.length?`<div class="history-list">${[...state.history].reverse().map(h=>`<button class="archive-issue" data-action="history" data-week="${h.week}"><div class="mini-paper"><div style="font-size:8px;letter-spacing:.12em;display:flex;justify-content:space-between"><span>БЕЛФОРД</span><span>№${h.week}</span></div><div class="m-head">Городской вестник</div><div class="m-title">${esc(h.stories[h.lead])}</div><div class="m-art"></div><div class="m-lines"></div></div><div class="archive-summary"><span>${nfmt(h.sold)} читателей</span><b class="${h.profit<0?'loss':''}">${sign(h.profit)}</b></div></button>`).join('')}</div>`:`<div class="empty-panel"><div class="eyebrow">АРХИВ ПОКА ПУСТ</div><h3>Газета ещё не вышла</h3><p>Первый номер появится здесь сразу после печати. Вернитесь в редакцию, выберите материалы и запустите тираж.</p><button class="btn" data-action="tab" data-tab="editor">В редакцию</button></div>`}</div>`}
  function finance(){const f=getForecast();const last=state.history.at(-1);return `<div class="screen-inner"><div class="intro"><div><div class="eyebrow">ПРАВЛЕНИЕ ИЗДАТЕЛЬСТВА</div><h1 class="section-title">Главная бухгалтерия</h1><p class="section-sub">Деньги на счёте — не то же самое, что прибыль. Каждый номер имеет стоимость подготовки, печати и кредита; конкуренты действуют за свой счёт.</p></div></div>${statStrip()}<div class="market-grid"><div class="plate"><div class="eyebrow">ОТКРЫТАЯ КНИГА</div><h3 style="font:27px Georgia,serif;margin:8px 0 22px">Экономика издания</h3><div class="lineitem"><span>Сейчас в кассе</span><strong>${money(state.cash)}</strong></div><div class="lineitem"><span>Непогашенный кредит</span><strong>${money(state.loan)}</strong></div><div class="lineitem"><span>Цена нового выпуска</span><strong>${money(state.price)}</strong></div><div class="lineitem"><span>План тиража</span><strong>${nfmt(state.printed)} экз.</strong></div><div class="lineitem"><span>Прогноз спроса</span><strong>${nfmt(f.demand)} экз.</strong></div><div class="lineitem total"><span>Прогноз прибыли</span><strong class="${f.estimated<0?'loss':'gain'}">${sign(f.estimated)}</strong></div><div class="saves-group"><button class="btn" data-action="payloan" ${state.loan===0||state.cash<100?'disabled':''}>Погасить $100 кредита</button><button class="btn" data-action="tab" data-tab="editor">Изменить выпуск</button></div></div><div class="plate"><div class="eyebrow">КРИТИЧЕСКИЕ ПОКАЗАТЕЛИ</div><h3 style="font:27px Georgia,serif;margin:8px 0 22px">Здоровье бизнеса</h3><div class="lineitem"><span>Чистые активы</span><strong>${money(state.cash-state.loan)}</strong></div><div class="lineitem"><span>Объём рекламы (рынок)</span><strong>${money(AD_BUDGET)}</strong></div><div class="lineitem"><span>Доверие читателей</span><strong>${state.trust} / 100</strong></div><div class="lineitem"><span>Последний чистый результат</span><strong class="${(last?.profit||0)<0?'loss':'gain'}">${last?sign(last.profit):'—'}</strong></div><div class="lineitem"><span>Выпущено номеров</span><strong>${state.history.length} / ${chapterLength}</strong></div><div class="notice">Мы проверяем баланс кассы при каждом ходе. Нет скрытых денежных бонусов, а продажа газеты не может превысить напечатанный тираж.</div></div></div>${state.history.length?`<div class="plate" style="margin-top:19px"><div class="eyebrow">ОБОРОТНЫЙ КАПИТАЛ</div><h3 style="font:25px Georgia,serif;margin:9px 0 16px">Как менялась касса</h3><div class="results-chart">${state.history.map(h=>`<div data-week="${h.week}" class="${h.profit<0?'loss-chart':''}" title="Выпуск №${h.week}: ${money(h.cash)}" style="height:${clamp(100*h.cash/Math.max(4000,...state.history.map(x=>x.cash)),3,100)}%"></div>`).join('')}</div></div>`:''}<div class="saves-group"><button class="btn" data-action="export">Экспорт сохранения</button><button class="btn" data-action="import">Импорт сохранения</button><button class="btn danger" data-action="reset">Новая партия</button></div></div>`}
  function header(){return `<header class="game-head"><div class="game-brand">MEDIA <span>EMPIRE</span><small>МЕДИА • ВЛАСТЬ • ВЛИЯНИЕ</small></div><div class="game-date"><b>1900</b><small>БЕЛФОРД<br>НЕДЕЛЯ ${String(Math.min(state.week,12)).padStart(2,'0')} / 12</small></div><div class="game-head-right"><strong>«Городской вестник»</strong><span class="save-indicator">● АВТОСОХРАНЕНИЕ</span></div></header>`}
  const TABS=[['editor','Редакция'],['world','Город'],['market','Конкуренты'],['finance','Финансы'],['archive','Газеты']];
  function tabs(){return `<nav class="game-tabs" aria-label="Игровые разделы">${TABS.map(([id,t])=>`<button data-action="tab" data-tab="${id}" class="${active===id?'active':''}" aria-current="${active===id?'page':'false'}">${t}</button>`).join('')}<div class="right"><button class="small-btn" data-action="save">Сохранить</button></div></nav>`}
  function footer(){const over=state.week>chapterLength;const f=getForecast();return `<footer class="in-game-foot"><div class="foot-left"><strong>${over?'Первая глава завершена':'Субботний выпуск №'+String(state.week).padStart(3,'0')}</strong><p>${over?'12 недель газетной кампании пройдены. Можно изучить архив или начать новую партию.':state.selected.length===6?'Редакция готова. Прогноз: '+sign(f.estimated)+' · следующий ход меняет рынок.':'Для выпуска выберите ровно 6 материалов.'}</p></div><div class="foot-actions"><button class="btn action-icon" title="Отправить итоги в настоящую переписку" data-action="tochat">В чат ↗</button><button class="btn primary" data-action="${over?'ending':'publish'}" ${!over&&state.selected.length!==6?'disabled':''}>${over?'Итоги главы':'Выпустить номер →'}</button></div></footer>`}
  function render(){persist();root.innerHTML=header()+tabs()+`<main class="screen"><div class="screen-body">${state.week>chapterLength&&active==='editor'?endingScreen():active==='editor'?editor():active==='market'?market():active==='world'?world():active==='archive'?archive():finance()}</div></main>`+footer();renderModal();}
  function endingScreen(){const last=state.history.at(-1),total=state.history.reduce((a,h)=>a+h.profit,0);return `<div class="screen-inner"><div class="eyebrow">ФИНАЛ ГЛАВЫ / БЕЛФОРД 1900</div><h1 class="section-title">Первые три месяца империи</h1><p class="section-sub">Двенадцать настоящих номеров, конкуренты и весь ваш путь остались в архиве. Это игровой тест стартовой главы, не финал многовековой кампании.</p>${statStrip()}<div class="market-grid"><div class="plate"><h3 style="font:28px Georgia,serif;margin-bottom:15px">Баланс квартала</h3><div class="lineitem"><span>Итоговая касса</span><strong>${money(state.cash)}</strong></div><div class="lineitem"><span>Суммарная прибыль</span><strong>${sign(total)}</strong></div><div class="lineitem"><span>Последние продажи</span><strong>${nfmt(last?.sold||0)}</strong></div><div class="lineitem"><span>Финальное доверие</span><strong>${state.trust}/100</strong></div><div class="lineitem"><span>Новые конкуренты</span><strong>${state.rivals.length-3}</strong></div></div><div class="plate"><h3 style="font:28px Georgia,serif;margin-bottom:15px">Что дальше</h3><p class="section-sub">В большой MEDIA EMPIRE издание войдёт в следующий год, затем придут радио, кино, телевидение, интернет и новые независимые компании. Здесь мы тестируем живую экономику газетного старта.</p><div class="saves-group"><button class="btn" data-action="tab" data-tab="archive">Открыть архив</button><button class="btn" data-action="tochat">Обсудить результат</button></div></div></div></div>`}
  function showToast(txt){toastEl.textContent=txt;toastEl.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toastEl.classList.remove('show'),3400)}
  function renderModal(){if(!modal){modalRoot.innerHTML='';return;}const m=modal;let body='';
    if(m.type==='report'||m.type==='history'){const h=m.record;body=`<div class="eyebrow">ОТЧЁТ ТИПОГРАФИИ · НОМЕР ${h.week}</div><h2>${esc(h.stories[h.lead])}</h2><p>Газета вышла ${esc(weekDate(h.week))}. Все числа рассчитаны по продажам, себестоимости, рекламе и действиям соперников.</p><div class="report-kpis"><div><strong>${nfmt(h.sold)}</strong><small>Продано экземпляров</small></div><div><strong class="${h.profit>=0?'gain':'loss'}">${sign(h.profit)}</strong><small>Прибыль выпуска</small></div><div><strong>${h.trustAfter}/100</strong><small>Доверие после выпуска</small></div></div><table class="report-table"><tr><td>Выручка от продаж</td><td>+${money(h.ticket)}</td></tr><tr><td>Доход от рекламы</td><td>+${money(h.adRevenue)}</td></tr><tr><td>Печатные расходы</td><td>−${money(h.printCost)}</td></tr><tr><td>Редакция и содержание</td><td>−${money(h.editorCost+h.overhead)}</td></tr><tr><td>Проценты банка</td><td>−${money(h.interest)}</td></tr><tr><td>Итог на счёте</td><td>${money(h.cash)}</td></tr></table>${h.notes.map(n=>`<div class="report-note">${esc(n)}</div>`).join('')}<div class="modal-actions"><button class="btn" data-action="tochat">Вставить результат в чат</button><button class="btn primary" data-action="closemodal">${m.type==='history'?'Вернуться к архиву':'Продолжить игру →'}</button></div>`}
    if(m.type==='investigate'){body=`<div class="eyebrow">СОБЫТИЕ · НЕДЕЛЯ 04</div><h2>Правда или рекламодатель?</h2><p>Редакция получила документы по электростанции. Материал может укрепить доверие аудитории, но крупный рекламодатель может уйти. Выбор будет учтён в ближайшем выпуске.</p><div class="decision-row"><button data-action="choice" data-choice="publish"><b>Опубликовать</b><span>Больше доверия и спроса, но риск потери рекламных поступлений.</span></button><button data-action="choice" data-choice="hold"><b>Проверить позже</b><span>Сохранить договоры и избежать риска; доверие может пострадать.</span></button></div>`}
    if(m.type==='reset'){body=`<div class="eyebrow">НОВАЯ КАМПАНИЯ</div><h2>Начать заново?</h2><p>Текущая партия, архив и деньги будут перезаписаны на этом устройстве. Сначала можно сохранить JSON-файл партии.</p><div class="modal-actions"><button class="btn" data-action="closemodal">Оставить как есть</button><button class="btn danger" data-action="resetconfirm">Новая игра</button></div>`}
    if(m.type==='ending'){const total=state.history.reduce((a,h)=>a+h.profit,0);body=`<div class="eyebrow">ГЛАВА ПРОЙДЕНА · 1900</div><h2>Редакция стала бизнесом</h2><p>За двенадцать недель вы выпустили ${state.history.length} газетных номеров, конкурировали за ${nfmt(CITY_HOUSEHOLDS)} домохозяйств и прошли финансовые испытания.</p><div class="report-kpis"><div><strong>${money(state.cash)}</strong><small>Касса компании</small></div><div><strong class="${total<0?'loss':'gain'}">${sign(total)}</strong><small>Прибыль главы</small></div><div><strong>${state.trust}/100</strong><small>Доверие аудитории</small></div></div><div class="modal-actions"><button class="btn" data-action="tochat">Разобрать партию в чате</button><button class="btn primary" data-action="closemodal">Закрыть итоги</button></div>`}
    modalRoot.innerHTML=`<div class="modal-layer" data-action="closemodal-overlay"><article class="modal-card" role="dialog" aria-modal="true" aria-label="Игровое окно"><button class="close" data-action="closemodal" aria-label="Закрыть">×</button>${body}</article></div>`;
  }
  function reportForCurrentWeek(){return state.history.at(-1)}
  function competitorMove(s,r,i,week,sales){
    if(!r.active)return;
    const priceMove=rand(week,i+3);
    const policy=priceMove>.65?'Цена снижена ради тиража':priceMove<.25?'Выбраны дорогие авторские материалы':'Усилена реклама и работа с агентствами';
    const oldPrice=r.price;
    if(priceMove>.65)r.price=clamp(Number((r.price-.01).toFixed(2)),.06,.20);
    else if(priceMove<.25)r.price=clamp(Number((r.price+.01).toFixed(2)),.06,.20);
    r.lastSales=sales;
    const ad=Math.round(AD_BUDGET*(sales/Math.max(1000,getForecast(s).allSales))*.68);
    const income=Math.round(sales*oldPrice)+ad;
    const expenses=Math.round(r.printed*.035)+[590,510,435,510][i]||500;
    const profit=income-expenses;
    r.cash=Math.round(r.cash+profit);
    r.trust=clamp(r.trust+(sales<r.printed*.7?-1:1)+(priceMove<.25?1:0),24,95);
    r.action=policy+`; ${profit>=0?'прибыль':'убыток'} ${sign(profit)}`;
    if(r.cash<0){r.active=false;r.lastSales=0;r.action='Редакция остановила выпуск из-за непогашенных обязательств.';}
    return {name:r.name,sales,price:oldPrice,profit,active:r.active};
  }
  function publish(){
    if(state.week>chapterLength)return;
    if(state.selected.length!==6){showToast('Нужно выбрать ровно шесть материалов.');return;}
    if(state.week===4&&state.investigation===null){modal={type:'investigate'};renderModal();return;}
    const s=state,week=s.week,f=getForecast(s),topics=storiesFor(),before=s.trust;
    const disturbance=rand(week,12);
    const volatility=0.94+disturbance*.12;
    const sold=Math.min(s.printed,Math.max(0,Math.round(f.sold*volatility)));
    const demand=Math.max(0,Math.round(f.demand*volatility));
    const ticket=Math.round(sold*s.price),adRevenue=Math.round(f.adRevenue*(.94+rand(week,2)*.12));
    const investigationPenalty=week===4&&s.investigation==='publish'?110:0;
    const interest=f.interest;
    const expenses=f.printCost+f.editorCost+f.overhead+interest;
    const profit=ticket+Math.max(0,adRevenue-investigationPenalty)-expenses;
    const notes=[];
    if(sold<s.printed)notes.push(`Непроданный тираж: ${nfmt(s.printed-sold)} экз. Бумага и печать оплачены полностью.`);
    if(demand>s.printed)notes.push(`Спрос превысил тираж на ${nfmt(demand-s.printed)} экземпляров. Часть покупателей ушла к конкурентам.`);
    const diversity=new Set(s.selected.map(i=>TOPICS[i])).size;
    const topicTrust=s.selected.reduce((x,i)=>x+EFFECT[i],0);
    const growth=Math.round((topicTrust-5)/3)+(diversity>=5?1:0)+(sold>5800?1:-1);
    const eventBonus=week===4?(s.investigation==='publish'?7:-4):0;
    s.trust=clamp(s.trust+growth+eventBonus,20,99);
    if(week===4)notes.push(s.investigation==='publish'?'Публикация документов по электростанции повысила доверие, но рекламодатель сократил бюджет.':'Редакция отложила расследование. Рекламные отношения сохранились, аудитория усомнилась в независимости.');
    s.cash=Math.round(s.cash+profit);
    s.readers=sold;
    const competitorActions=s.rivals.map((r,i)=>competitorMove(s,r,i,week,f.rivalSales[i]||0)).filter(Boolean);
    if(week===10){notes.push('Инвесторы изучают рынок перед возможным запуском новой газеты.');}
    if(week===10&&rand(week,88)>.18){
      s.rivals.push({id:'northern',name:'Северная газета',price:.09,printed:5300,lastSales:0,trust:54,cash:4200,active:true,action:'Новая независимая компания: инвесторы внесли капитал, купили оборудование.'});
      notes.push('В следующем выпуске вступит новый конкурент «Северная газета». У него собственное финансирование и стратегия.');
    }
    if(profit<0)notes.push('Редакция закончила неделю с убытком: пересмотрите цену, структуру затрат или тираж.');
    else notes.push('Газета завершила неделю с прибылью. Оцените, какой рост был вызван продажами, а какой рекламой.');
    const h={week,price:s.price,printed:s.printed,sold,demand,share:Math.round(1000*sold/CITY_HOUSEHOLDS)/10,ticket,adRevenue:Math.max(0,adRevenue-investigationPenalty),editorCost:f.editorCost,printCost:f.printCost,overhead:f.overhead,interest,profit,cash:s.cash,trustBefore:before,trustAfter:s.trust,lead:s.lead,selected:[...s.selected],stories:topics.map(x=>x.title),notes,competitors:competitorActions};
    s.history.push(h);
    s.events.push({week,text:`Выпущен №${week}: ${nfmt(sold)} экземпляров, ${sign(profit)} прибыли. ${notes[0]||''}`});
    s.week+=1;
    if(s.week<=chapterLength){s.selected=[0,1,2,3,4,5];s.lead=0;}
    active='editor';modal={type:'report',record:h};render();
  }
  function toChat(){const last=reportForCurrentWeek(),f=getForecast();const summary=last?`MEDIA EMPIRE — тест партии. Белфорд, 1900. Выпуск №${last.week} «${last.stories[last.lead]}». Напечатано ${nfmt(last.printed)}, продано ${nfmt(last.sold)}, цена ${money(last.price)}, реклама ${money(last.adRevenue)}, прибыль ${sign(last.profit)}, касса ${money(state.cash)}, кредит ${money(state.loan)}, доверие ${state.trust}/100. Конкуренты: ${state.rivals.map(r=>`${r.name}: ${nfmt(r.lastSales)} продаж, цена ${money(r.price)}`).join('; ')}. Проанализируй итоги партии, решения конкурентов и предложи один следующий игровой шаг с поправками баланса.`:`MEDIA EMPIRE — Белфорд, 1900, первый номер. Стратегия «Газета для каждого»: цена ${money(state.price)}, тираж ${nfmt(state.printed)}. Касса ${money(state.cash)}, кредит ${money(state.loan)}, доверие ${state.trust}/100. Прогноз продаж ${nfmt(f.demand)}, прогноз прибыли ${sign(f.estimated)}. Проанализируй стартовые решения и предложи следующий игровой шаг.`;
    if(window.parent!==window){window.parent.postMessage({type:'ME_TO_CHAT',message:summary},'*');showToast('Отправлено в поле ввода исходного чата. Проверьте и отправьте.');}
    else if(navigator.clipboard?.writeText){navigator.clipboard.writeText(summary).then(()=>showToast('Сводка скопирована. Вставьте её в ChatGPT.')).catch(()=>showToast('Копирование недоступно в этом браузере.'));}
    else showToast('Сводка доступна при запуске через расширение ChatGPT.');
  }
  function exportSave(){const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='MEDIA_EMPIRE_BELFORD_SAVE_'+state.history.length+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Файл сохранения подготовлен.');}
  function importSave(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.addEventListener('change',async()=>{const file=inp.files?.[0];if(!file)return;if(file.size>1024*1024){showToast('Сохранение превышает 1 МБ.');return;}try{const candidate=JSON.parse(await file.text());if(!validSave(candidate))throw Error('bad');state=candidate;active='editor';modal=null;render();showToast('Сохранение импортировано.');}catch{showToast('Не удалось открыть совместимое сохранение.')}});inp.click();}
  document.addEventListener('click',event=>{
    const el=event.target.closest('[data-action]');if(!el)return;
    const a=el.dataset.action;
    if(a==='closemodal-overlay'&&event.target!==el)return;
    if(a==='tab'){active=el.dataset.tab;modal=null;render();return;}
    if(a==='story'){const i=Number(el.dataset.id);if(!Number.isInteger(i))return;const selected=state.selected;if(selected.includes(i)){if(selected.length<=1){showToast('В номере должен быть хотя бы один материал.');return;}state.selected=selected.filter(x=>x!==i);if(state.lead===i)state.lead=state.selected[0];}else if(selected.length<6)state.selected=[...selected,i];else {showToast('Шесть полос заняты. Сначала уберите один материал.');return;}render();return;}
    if(a==='lead'){event.stopPropagation();const i=Number(el.dataset.id);if(!state.selected.includes(i)){if(state.selected.length===6){showToast('Сначала освободите место для этого материала.');return;}state.selected.push(i)}state.lead=i;render();return;}
    if(a==='publish'){publish();return;}
    if(a==='tochat'){toChat();return;}
    if(a==='history'){const h=state.history.find(x=>x.week===Number(el.dataset.week));if(h){modal={type:'history',record:h};renderModal()}return;}
    if(a==='save'){persist();showToast('Партия сохранена на этом устройстве.');return;}
    if(a==='investigate'){modal={type:'investigate'};renderModal();return;}
    if(a==='choice'){state.investigation=el.dataset.choice;modal=null;render();return;}
    if(a==='loc'){loc=el.dataset.id;render();return;}
    if(a==='closemodal'||a==='closemodal-overlay'){modal=null;renderModal();return;}
    if(a==='reset'){modal={type:'reset'};renderModal();return;}
    if(a==='resetconfirm'){state=starter();active='editor';modal=null;render();showToast('Новая партия начата.');return;}
    if(a==='ending'){modal={type:'ending'};renderModal();return;}
    if(a==='export'){exportSave();return;}
    if(a==='import'){importSave();return;}
    if(a==='payloan'){if(state.loan>0&&state.cash>=100){const p=Math.min(100,state.loan);state.cash-=p;state.loan-=p;render();showToast('Погашено '+money(p)+' кредита.');}return;}
  });
  document.addEventListener('input',event=>{
    const t=event.target;
    if(t.dataset.change==='price'){state.price=Number(t.value);const out=document.getElementById('price-output');if(out)out.textContent=money(state.price);}
    else if(t.dataset.change==='printed'){state.printed=Number(t.value);const out=document.getElementById('print-output');if(out)out.textContent=nfmt(state.printed);}
    else return;
    const f=getForecast(),forecast=document.getElementById('forecast');
    const demand=document.getElementById('demand-val');if(demand)demand.textContent=nfmt(f.demand);
    if(forecast)forecast.innerHTML=`<div class="lineitem"><span>Продажи</span><strong>${money(f.ticket)}</strong></div><div class="lineitem"><span>Рекламная выручка</span><strong>${money(f.adRevenue)}</strong></div><div class="lineitem"><span>Бумага и печать</span><strong>−${money(f.printCost)}</strong></div><div class="lineitem"><span>Редакция, аренда, проценты</span><strong>−${money(f.expenses-f.printCost)}</strong></div><div class="lineitem total"><span>Ожидаемый результат</span><strong class="${f.estimated>=0?'gain':'loss'}">${sign(f.estimated)}</strong></div>`;
    persist();
  });
  document.addEventListener('change',event=>{if(event.target.matches('[data-change]'))render();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal){modal=null;renderModal();}if((event.key==='Enter'||event.key===' ')&&event.target.matches('.story-card')){event.preventDefault();event.target.click();}});
  window.addEventListener('message',e=>{if(e.data?.type==='ME_CHAT_INSERT'){showToast(e.data.ok?'Сводка вставлена в настоящий чат слева.':e.data.reason||'Скопируйте сводку вручную.')}});
  render();
})();

</script>
